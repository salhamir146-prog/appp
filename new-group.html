<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ساخت گروه جدید</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Vazirmatn;-webkit-tap-highlight-color:transparent}
        body{background:#f4f6f9;min-height:100vh;display:flex;flex-direction:column}
        
        .app-header{background:#ffffff;padding:14px 18px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #e4e7eb;position:sticky;top:0;z-index:100}
        .app-header .back-btn{font-size:24px;cursor:pointer;color:#707579;transition:color 0.2s}
        .app-header .back-btn:hover{color:#3CBF8A}
        .app-header h1{font-size:17px;font-weight:600;color:#222;flex:1}
        
        .main-container{padding:24px 16px;max-width:520px;margin:0 auto;width:100%;flex:1}
        .section-title{font-size:13px;color:#3CBF8A;font-weight:600;margin-bottom:12px}
        
        .input-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
        .input-group label{font-size:13px;color:#707579;font-weight:500}
        .app-input{width:100%;padding:14px 16px;background:#ffffff;border:1.5px solid #e4e7eb;border-radius:12px;font-size:15px;outline:none;transition:border-color 0.3s;color:#222}
        .app-input:focus{border-color:#3CBF8A;box-shadow:0 0 0 3px rgba(60,191,138,0.1)}
        .app-input::placeholder{color:#b0b8c1}
        
        .app-submit-btn{width:100%;padding:15px;background:#3CBF8A;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:background 0.2s;margin-top:8px}
        .app-submit-btn:hover{background:#32a875}
        .app-submit-btn:active{transform:scale(0.97)}
        .app-submit-btn:disabled{opacity:0.5;cursor:not-allowed}
        
        .result-box{padding:16px;border-radius:12px;margin-top:16px;display:none;font-size:14px}
        .result-box.success{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7;display:block}
        .result-box.error{background:#fce4ec;color:#c62828;border:1px solid #ef9a9a;display:block}
        .result-box.info{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block}
        
        .loader-box{text-align:center;padding:30px;display:none}
        .loader-box .spinner{width:28px;height:28px;border:3px solid #e4e7eb;border-top-color:#3CBF8A;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 10px}
        @keyframes spin{to{transform:rotate(360deg)}}

        .member-list{margin-top:12px;display:flex;flex-direction:column;gap:6px}
        .member-item{display:flex;align-items:center;padding:10px 14px;background:#ffffff;border-radius:10px;border:1px solid #e4e7eb;gap:12px}
        .member-item .avatar{width:36px;height:36px;border-radius:50%;background:#3CBF8A;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0}
        .member-item .info{flex:1}
        .member-item .name{font-size:14px;font-weight:500;color:#222}
        .member-item .remove{color:#e53935;cursor:pointer;font-size:20px}
        
        .add-member-btn{width:100%;padding:12px;background:#f4f6f9;border:1.5px dashed #3CBF8A;border-radius:12px;color:#3CBF8A;font-size:14px;font-weight:500;cursor:pointer;transition:background 0.2s;margin-top:8px;text-align:center}
        .add-member-btn:hover{background:#e8f5e9}
    </style>
</head>
<body>

    <div class="app-header">
        <span class="back-btn material-icons-round" onclick="window.location.href='chats.html'">arrow_forward</span>
        <h1>ساخت گروه جدید</h1>
    </div>

    <div class="main-container">
        <div class="section-title">اطلاعات گروه</div>
        
        <div class="input-group">
            <label>نام گروه</label>
            <input type="text" id="groupName" class="app-input" placeholder="نام گروه را وارد کنید">
        </div>
        
        <div class="input-group">
            <label>توضیحات (اختیاری)</label>
            <input type="text" id="groupDesc" class="app-input" placeholder="توضیحات گروه">
        </div>

        <div class="section-title" style="margin-top:8px;">اعضای گروه</div>
        <div id="memberList" class="member-list">
            <div class="member-item">
                <div class="avatar" id="creatorAvatar">ا</div>
                <div class="info"><div class="name" id="creatorName">شما (مدیر)</div></div>
            </div>
        </div>

        <div class="add-member-btn" onclick="addMember()">+ اضافه کردن عضو جدید</div>

        <button class="app-submit-btn" id="createBtn" onclick="createGroup()">ایجاد گروه</button>
        
        <div id="loader" class="loader-box"><div class="spinner"></div><div>در حال ایجاد گروه...</div></div>
        <div id="resultBox" class="result-box"></div>
    </div>

    <script>
        const WORKER_URL = "https://appp.salhamir146.workers.dev";
        const userId = localStorage.getItem('userId');
        if (!userId) window.location.href = 'index.html';

        let members = [userId];

        async function addMember() {
            const phone = prompt('شماره تلفن عضو جدید را وارد کنید:');
            if (!phone) return;
            
            const cleanPhone = phone.replace(/\D/g, '');
            if (cleanPhone.length < 9) {
                alert('شماره تلفن نامعتبر است.');
                return;
            }

            try {
                const response = await fetch(`${WORKER_URL}/api/find-user?phone=${cleanPhone}`);
                const data = await response.json();
                
                if (data.success && data.user) {
                    if (members.includes(data.user.id)) {
                        alert('این کاربر قبلاً اضافه شده است.');
                        return;
                    }
                    members.push(data.user.id);
                    renderMembers();
                } else {
                    alert('کاربری با این شماره یافت نشد.');
                }
            } catch (err) {
                alert('خطا در جستجوی کاربر.');
            }
        }

        function renderMembers() {
            const list = document.getElementById('memberList');
            list.innerHTML = members.map(id => {
                const isCreator = id == userId;
                return `
                    <div class="member-item">
                        <div class="avatar">${isCreator ? 'ش' : 'ع'}</div>
                        <div class="info">
                            <div class="name">${isCreator ? 'شما (مدیر)' : 'کاربر ' + id.slice(-4)}</div>
                        </div>
                        ${!isCreator ? `<span class="remove" onclick="removeMember('${id}')">×</span>` : ''}
                    </div>
                `;
            }).join('');
        }

        function removeMember(id) {
            members = members.filter(m => m !== id);
            renderMembers();
        }

        async function createGroup() {
            const name = document.getElementById('groupName').value.trim();
            const desc = document.getElementById('groupDesc').value.trim();
            const resultBox = document.getElementById('resultBox');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('createBtn');

            if (!name) {
                resultBox.className = 'result-box error';
                resultBox.textContent = 'لطفاً نام گروه را وارد کنید.';
                resultBox.style.display = 'block';
                return;
            }

            if (members.length < 2) {
                resultBox.className = 'result-box error';
                resultBox.textContent = 'حداقل ۲ عضو برای ایجاد گروه نیاز است.';
                resultBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            loader.style.display = 'block';
            resultBox.style.display = 'none';

            try {
                const chatId = 'group_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);
                
                const response = await fetch(`${WORKER_URL}/api/create-chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        chatId, 
                        userIds: members,
                        chatName: name,
                        chatType: 'group',
                        chatDesc: desc
                    })
                });
                const data = await response.json();

                if (data.success) {
                    await fetch(`${WORKER_URL}/api/send-message`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chatId, senderId: userId, text: 'گروه ' + name + ' ایجاد شد. خوش آمدید.' })
                    });

                    resultBox.className = 'result-box success';
                    resultBox.textContent = 'گروه "' + name + '" با موفقیت ایجاد شد.';
                    resultBox.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = `chat.html?chatId=${chatId}`;
                    }, 1500);
                } else {
                    resultBox.className = 'result-box error';
                    resultBox.textContent = 'خطا در ایجاد گروه.';
                    resultBox.style.display = 'block';
                }
            } catch (err) {
                resultBox.className = 'result-box error';
                resultBox.textContent = 'خطا در ارتباط با سرور.';
                resultBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }

        document.getElementById('groupName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') createGroup();
        });

        renderMembers();
    </script>
</body>
</html>
