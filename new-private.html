<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>گفتگوی خصوصی جدید</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Vazirmatn;-webkit-tap-highlight-color:transparent}
        body{background:#f4f6f9;min-height:100vh;display:flex;flex-direction:column}
        
        .app-header{background:#ffffff;padding:14px 18px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #e4e7eb;position:sticky;top:0;z-index:100}
        .app-header .back-btn{font-size:24px;cursor:pointer;color:#707579;transition:color 0.2s}
        .app-header .back-btn:hover{color:#3CBF8A}
        .app-header h1{font-size:17px;font-weight:600;color:#222;flex:1}
        
        .main-container{padding:24px 16px;max-width:520px;margin:0 auto;width:100%;flex:1}
        .section-title{font-size:13px;color:#3CBF8A;font-weight:600;margin-bottom:12px}
        
        .input-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
        .input-group label{font-size:13px;color:#707579;font-weight:500}
        .app-input{width:100%;padding:14px 16px;background:#ffffff;border:1.5px solid #e4e7eb;border-radius:12px;font-size:15px;outline:none;transition:border-color 0.3s;color:#222}
        .app-input:focus{border-color:#3CBF8A;box-shadow:0 0 0 3px rgba(60,191,138,0.1)}
        .app-input::placeholder{color:#b0b8c1}
        
        .app-submit-btn{width:100%;padding:15px;background:#3CBF8A;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:background 0.2s;margin-top:8px}
        .app-submit-btn:hover{background:#32a875}
        .app-submit-btn:active{transform:scale(0.97)}
        .app-submit-btn:disabled{opacity:0.5;cursor:not-allowed}
        
        .result-box{padding:16px;border-radius:12px;margin-top:16px;display:none;font-size:14px}
        .result-box.success{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7;display:block}
        .result-box.error{background:#fce4ec;color:#c62828;border:1px solid #ef9a9a;display:block}
        .result-box.info{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block}
        
        .loader-box{text-align:center;padding:30px;display:none}
        .loader-box .spinner{width:28px;height:28px;border:3px solid #e4e7eb;border-top-color:#3CBF8A;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 10px}
        @keyframes spin{to{transform:rotate(360deg)}}
        
        .user-card{display:flex;align-items:center;padding:14px;background:#ffffff;border-radius:12px;border:1px solid #e4e7eb;margin-top:12px;gap:14px}
        .user-card .avatar{width:48px;height:48px;border-radius:50%;background:#3CBF8A;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;flex-shrink:0}
        .user-card .info{flex:1}
        .user-card .name{font-size:15px;font-weight:600;color:#222}
        .user-card .phone{font-size:12px;color:#707579}
    </style>
</head>
<body>

    <div class="app-header">
        <span class="back-btn material-icons-round" onclick="window.location.href='chats.html'">arrow_forward</span>
        <h1>گفتگوی خصوصی جدید</h1>
    </div>

    <div class="main-container">
        <div class="section-title">اطلاعات مخاطب</div>
        
        <div class="input-group">
            <label>شماره تلفن همراه</label>
            <input type="tel" id="phoneInput" class="app-input" placeholder="مثلاً 9981064505" dir="ltr" maxlength="11">
        </div>
        
        <div class="input-group">
            <label>نام مخاطب (اختیاری)</label>
            <input type="text" id="nameInput" class="app-input" placeholder="نام مخاطب را وارد کنید">
        </div>

        <button class="app-submit-btn" id="searchBtn" onclick="searchAndStart()">جستجو و شروع گفتگو</button>
        
        <div id="loader" class="loader-box"><div class="spinner"></div><div>در حال جستجو...</div></div>
        <div id="resultBox" class="result-box"></div>
    </div>

    <script>
        const WORKER_URL = "https://appp.salhamir146.workers.dev";
        const userId = localStorage.getItem('userId');
        if (!userId) window.location.href = 'index.html';

        async function searchAndStart() {
            const phone = document.getElementById('phoneInput').value.trim().replace(/\D/g, '');
            const name = document.getElementById('nameInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('searchBtn');

            if (phone.length < 9) {
                resultBox.className = 'result-box error';
                resultBox.textContent = 'لطفاً شماره تلفن معتبر ۱۰ رقمی را وارد کنید.';
                resultBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            loader.style.display = 'block';
            resultBox.style.display = 'none';

            try {
                const response = await fetch(`${WORKER_URL}/api/find-user?phone=${phone}`);
                const data = await response.json();

                if (data.success && data.user) {
                    const targetUser = data.user;
                    
                    if (targetUser.id == userId) {
                        resultBox.className = 'result-box error';
                        resultBox.textContent = 'این شماره متعلق به حساب کاربری شماست.';
                        resultBox.style.display = 'block';
                        btn.disabled = false;
                        loader.style.display = 'none';
                        return;
                    }

                    const chatId = 'private_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);
                    
                    const createRes = await fetch(`${WORKER_URL}/api/create-chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chatId, userIds: [userId, targetUser.id] })
                    });
                    const createData = await createRes.json();

                    if (createData.success) {
                        await fetch(`${WORKER_URL}/api/send-message`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ chatId, senderId: userId, text: 'گفتگو شروع شد.' })
                        });

                        resultBox.className = 'result-box success';
                        resultBox.textContent = 'گفتگو با ' + (targetUser.name || 'کاربر') + ' ایجاد شد.';
                        resultBox.style.display = 'block';
                        
                        setTimeout(() => {
                            window.location.href = `chat.html?chatId=${chatId}`;
                        }, 1200);
                    }
                } else {
                    resultBox.className = 'result-box error';
                    resultBox.textContent = 'کاربری با این شماره در سیستم یافت نشد.';
                    resultBox.style.display = 'block';
                }
            } catch (err) {
                resultBox.className = 'result-box error';
                resultBox.textContent = 'خطا در ارتباط با سرور. لطفاً دوباره تلاش کنید.';
                resultBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }

        document.getElementById('phoneInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchAndStart();
        });
    </script>
</body>
</html>
