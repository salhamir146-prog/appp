<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>چت جدید</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Vazirmatn}
        body{background:#0a0a0f;min-height:100vh;display:flex;flex-direction:column}
        .header{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);padding:16px 20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid rgba(255,255,255,0.05)}
        .header .back{font-size:24px;cursor:pointer;color:rgba(255,255,255,0.6)}
        .header h1{font-size:18px;font-weight:600;color:#fff;flex:1}
        .search-box{padding:16px 20px}
        .search-box input{width:100%;padding:14px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.06);border-radius:14px;color:#fff;font-size:15px;outline:none}
        .search-box input:focus{border-color:rgba(60,191,138,0.4)}
        .search-box input::placeholder{color:rgba(255,255,255,0.2)}
        .contacts-list{padding:0 16px 20px;flex:1;overflow-y:auto}
        .contact-item{display:flex;align-items:center;padding:14px 12px;background:rgba(255,255,255,0.03);border-radius:14px;margin-bottom:6px;cursor:pointer;transition:background 0.2s;border:1px solid rgba(255,255,255,0.03)}
        .contact-item:active{background:rgba(255,255,255,0.06)}
        .contact-avatar{width:44px;height:44px;border-radius:50%;margin-left:14px;background:linear-gradient(135deg,#3CBF8A,#2ea87a);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0}
        .contact-info{flex:1}
        .contact-name{font-size:14px;font-weight:500;color:#fff}
        .contact-phone{font-size:12px;color:rgba(255,255,255,0.3)}
        .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,0.3)}
        .empty-state span{font-size:48px;display:block;margin-bottom:12px}
        .empty-state h3{color:#fff;font-size:18px;margin-bottom:6px}
        .btn-create{width:100%;padding:16px;background:linear-gradient(135deg,#3CBF8A,#2ea87a);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px}
        .btn-create:active{transform:scale(0.97)}
        .loader{text-align:center;padding:20px;color:rgba(255,255,255,0.3)}
    </style>
</head>
<body>
    <div class="header">
        <span class="back material-icons-round" onclick="window.location.href='chats.html'">arrow_forward</span>
        <h1>✏️ چت جدید</h1>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="جستجوی کاربران..." onkeyup="searchUsers()">
    </div>

    <div class="contacts-list" id="contactsList">
        <div class="loader">🔍 در حال جستجو...</div>
    </div>

    <div style="padding: 0 20px 20px;">
        <button class="btn-create" onclick="createGroup()">➕ ایجاد گروه جدید</button>
    </div>

    <script>
        const WORKER_URL = "https://appp.salhamir146.workers.dev";
        const userId = localStorage.getItem('userId');
        let selectedUsers = [];

        async function searchUsers() {
            const query = document.getElementById('searchInput').value.trim();
            const list = document.getElementById('contactsList');

            if (query.length < 2) {
                list.innerHTML = `<div class="empty-state"><span>👤</span><h3>جستجوی کاربران</h3><p>حداقل ۲ کاراکتر وارد کنید</p></div>`;
                return;
            }

            try {
                const response = await fetch(`${WORKER_URL}/api/search-users?q=${query}`);
                const data = await response.json();

                if (data.success && data.users.length > 0) {
                    list.innerHTML = data.users
                        .filter(user => user.id != userId)
                        .map(user => `
                            <div class="contact-item" onclick="selectUser('${user.id}')">
                                <div class="contact-avatar">${user.name?.charAt(0) || '👤'}</div>
                                <div class="contact-info">
                                    <div class="contact-name">${user.name}</div>
                                    <div class="contact-phone">${user.phone}</div>
                                </div>
                                <span style="color:rgba(255,255,255,0.2);font-size:20px;">+</span>
                            </div>
                        `).join('');
                } else {
                    list.innerHTML = `<div class="empty-state"><span>😕</span><h3>کاربری یافت نشد</h3></div>`;
                }
            } catch (err) {
                list.innerHTML = `<div class="empty-state"><span>⚠️</span><h3>خطا در جستجو</h3></div>`;
            }
        }

        function selectUser(id) {
            if (selectedUsers.includes(id)) {
                selectedUsers = selectedUsers.filter(u => u !== id);
            } else {
                selectedUsers.push(id);
            }
            document.querySelectorAll('.contact-item').forEach(item => {
                item.style.borderColor = 'rgba(255,255,255,0.03)';
            });
            document.querySelectorAll('.contact-item').forEach(item => {
                if (item.textContent.includes(id)) {
                    item.style.borderColor = '#3CBF8A';
                }
            });
        }

        async function createGroup() {
            if (selectedUsers.length === 0) {
                alert('حداقل یک کاربر را انتخاب کنید.');
                return;
            }

            const chatId = 'chat_' + Date.now();
            const userIds = [userId, ...selectedUsers];

            try {
                const response = await fetch(`${WORKER_URL}/api/create-chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatId, userIds })
                });

                const data = await response.json();
                if (data.success) {
                    window.location.href = `chat.html?chatId=${chatId}`;
                } else {
                    alert('خطا در ایجاد چت');
                }
            } catch (err) {
                alert('خطا در ارتباط با سرور');
            }
        }

        // بارگذاری اولیه
        document.getElementById('contactsList').innerHTML = `
            <div class="empty-state"><span>💬</span><h3>کاربران را جستجو کنید</h3><p>برای شروع چت، نام یا شماره کاربر را وارد کنید</p></div>
        `;
    </script>
</body>
</html>
