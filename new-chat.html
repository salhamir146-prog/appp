<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>چت جدید</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Vazirmatn;-webkit-tap-highlight-color:transparent}
        body{background:#0a0a0f;min-height:100vh;display:flex;flex-direction:column}
        .header{background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);padding:14px 16px;display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(255,255,255,0.04)}
        .header .back{font-size:24px;cursor:pointer;color:rgba(255,255,255,0.5)}
        .header h1{font-size:17px;font-weight:600;color:#fff;flex:1}
        .search-box{padding:16px}
        .search-box input{width:100%;padding:14px 16px;background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.05);border-radius:14px;color:#fff;font-size:15px;outline:none;transition:border-color 0.3s}
        .search-box input:focus{border-color:rgba(60,191,138,0.4)}
        .search-box input::placeholder{color:rgba(255,255,255,0.15)}
        .search-box .hint{font-size:11px;color:rgba(255,255,255,0.15);margin-top:8px;text-align:center}
        .result-area{padding:0 16px;flex:1;overflow-y:auto}
        .user-card{display:flex;align-items:center;padding:14px;background:rgba(255,255,255,0.02);border-radius:14px;border:1px solid rgba(255,255,255,0.04);margin-bottom:8px;cursor:pointer;transition:all 0.3s}
        .user-card:active{background:rgba(255,255,255,0.05)}
        .user-card .avatar{width:48px;height:48px;border-radius:50%;margin-left:14px;background:linear-gradient(135deg,#3CBF8A,#2ea87a);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;flex-shrink:0}
        .user-card .info{flex:1}
        .user-card .name{font-size:15px;font-weight:500;color:#fff}
        .user-card .phone{font-size:12px;color:rgba(255,255,255,0.25)}
        .user-card .action{color:#3CBF8A;font-size:14px;font-weight:500}
        .empty-state{text-align:center;padding:50px 20px;color:rgba(255,255,255,0.15)}
        .empty-state span{font-size:48px;display:block;margin-bottom:12px}
        .empty-state h3{color:#fff;font-size:17px;font-weight:500;margin-bottom:4px}
        .empty-state p{font-size:13px;color:rgba(255,255,255,0.15)}
        .loader{text-align:center;padding:30px;color:rgba(255,255,255,0.2)}
        .loader .spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,0.05);border-top-color:#3CBF8A;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 10px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .bottom-bar{position:fixed;bottom:0;left:0;right:0;padding:12px 16px 20px;background:rgba(10,10,15,0.92);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.04)}
        .bottom-bar .info{font-size:12px;color:rgba(255,255,255,0.2);text-align:center}
        .bottom-bar .info strong{color:#fff}
    </style>
</head>
<body>
<div class="header">
    <span class="back material-icons-round" onclick="window.location.href='chats.html'">arrow_forward</span>
    <h1>✏️ چت جدید</h1>
</div>
<div class="search-box">
    <input type="tel" id="phoneInput" placeholder="شماره تلفن را وارد کنید..." dir="ltr" maxlength="11" oninput="searchUser()">
    <div class="hint">📱 مثلاً 9981064505 یا 09123456789</div>
</div>
<div class="result-area" id="resultArea">
    <div class="empty-state"><span>👤</span><h3>شماره کاربر را وارد کنید</h3><p>برای شروع چت، شماره تلفن کاربر را وارد کنید</p></div>
</div>
<div class="bottom-bar"><div class="info" id="bottomInfo">🔍 برای پیدا کردن کاربر، شماره را وارد کنید</div></div>

<script>
    const WORKER_URL = "https://appp.salhamir146.workers.dev";
    const userId = localStorage.getItem('userId');
    if (!userId) window.location.href = 'index.html';

    const phoneInput = document.getElementById('phoneInput');
    const resultArea = document.getElementById('resultArea');
    const bottomInfo = document.getElementById('bottomInfo');
    let currentUser = null;

    async function searchUser() {
        const phone = phoneInput.value.trim().replace(/\D/g, '');
        if (phone.length < 9) {
            resultArea.innerHTML = `<div class="empty-state"><span>🔢</span><h3>شماره را کامل وارد کنید</h3><p>حداقل ۹ رقم</p></div>`;
            bottomInfo.textContent = '📱 شماره را کامل وارد کنید';
            currentUser = null;
            return;
        }
        bottomInfo.textContent = '🔍 در حال جستجو...';
        resultArea.innerHTML = `<div class="loader"><div class="spinner"></div><div>در حال جستجو...</div></div>`;
        try {
            const response = await fetch(`${WORKER_URL}/api/find-user?phone=${phone}`);
            const data = await response.json();
            if (data.success && data.user) {
                currentUser = data.user;
                if (currentUser.id == userId) {
                    resultArea.innerHTML = `<div class="empty-state"><span>🙋</span><h3>این شماره متعلق به شماست!</h3><p>نمی‌توانید با خودتان چت کنید</p></div>`;
                    bottomInfo.textContent = '⚠️ این شماره خودتان است';
                    currentUser = null;
                    return;
                }
                resultArea.innerHTML = `
                    <div class="user-card" onclick="startChat()">
                        <div class="avatar">${currentUser.name?.charAt(0) || '👤'}</div>
                        <div class="info">
                            <div class="name">${currentUser.name || 'کاربر'}</div>
                            <div class="phone">${currentUser.phone}</div>
                        </div>
                        <div class="action">شروع چت ➜</div>
                    </div>
                `;
                bottomInfo.innerHTML = `✅ <strong>${currentUser.name}</strong> پیدا شد - کلیک کنید`;
            } else {
                resultArea.innerHTML = `<div class="empty-state"><span>➕</span><h3>کاربری یافت نشد</h3><p>شماره ${phone} در سیستم ثبت نشده است</p></div>`;
                bottomInfo.textContent = '❌ کاربری با این شماره یافت نشد';
                currentUser = null;
            }
        } catch (err) {
            resultArea.innerHTML = `<div class="empty-state"><span>⚠️</span><h3>خطا در جستجو</h3></div>`;
            bottomInfo.textContent = '❌ خطا در ارتباط با سرور';
            currentUser = null;
        }
    }

    async function startChat() {
        if (!currentUser) return;
        bottomInfo.textContent = '⏳ در حال ایجاد چت...';
        const chatId = 'chat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        try {
            const response = await fetch(`${WORKER_URL}/api/create-chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chatId, userIds: [userId, currentUser.id] })
            });
            const data = await response.json();
            if (data.success) {
                await fetch(`${WORKER_URL}/api/send-message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatId, senderId: userId, text: '👋 سلام! گفتگو شروع شد.', type: 'text' })
                });
                window.location.href = `chat.html?chatId=${chatId}`;
            } else {
                alert('خطا در ایجاد چت');
            }
        } catch (err) {
            alert('خطا در ارتباط با سرور');
        }
    }

    phoneInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && currentUser) startChat();
    });
</script>
</body>
</html>
