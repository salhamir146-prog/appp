<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>چت جدید</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Vazirmatn;-webkit-tap-highlight-color:transparent}
        body{background:#0a0a0f;min-height:100vh;display:flex;flex-direction:column}
        .header{background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);padding:14px 16px;display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(255,255,255,0.04)}
        .header .back{font-size:24px;cursor:pointer;color:rgba(255,255,255,0.5);transition:color 0.3s}
        .header .back:hover{color:rgba(255,255,255,0.8)}
        .header h1{font-size:17px;font-weight:600;color:#fff;flex:1}
        .header .selected-count{font-size:12px;color:#3CBF8A;font-weight:500}
        .search-box{padding:14px 16px 10px}
        .search-box input{width:100%;padding:14px 16px;background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.05);border-radius:14px;color:#fff;font-size:15px;outline:none;transition:border-color 0.3s}
        .search-box input:focus{border-color:rgba(60,191,138,0.4)}
        .search-box input::placeholder{color:rgba(255,255,255,0.15)}
        .contacts-list{padding:4px 16px 80px;flex:1;overflow-y:auto}
        .contact-item{display:flex;align-items:center;padding:12px 14px;background:rgba(255,255,255,0.02);border-radius:14px;margin-bottom:4px;cursor:pointer;transition:all 0.2s;border:1.5px solid transparent}
        .contact-item:active{background:rgba(255,255,255,0.05)}
        .contact-item.selected{border-color:#3CBF8A;background:rgba(60,191,138,0.06)}
        .contact-avatar{width:44px;height:44px;border-radius:50%;margin-left:14px;background:linear-gradient(135deg,#3CBF8A,#2ea87a);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0}
        .contact-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
        .contact-info{flex:1;min-width:0}
        .contact-name{font-size:14px;font-weight:500;color:#fff}
        .contact-phone{font-size:11px;color:rgba(255,255,255,0.25)}
        .contact-check{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;transition:all 0.3s;flex-shrink:0}
        .contact-item.selected .contact-check{background:#3CBF8A;border-color:#3CBF8A}
        .contact-item.selected .contact-check::after{content:'✓';color:#fff;font-size:14px;font-weight:700}
        .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,0.2)}
        .empty-state span{font-size:56px;display:block;margin-bottom:12px}
        .empty-state h3{color:#fff;font-size:17px;margin-bottom:4px;font-weight:500}
        .empty-state p{font-size:13px;color:rgba(255,255,255,0.2)}
        .bottom-bar{position:fixed;bottom:0;left:0;right:0;padding:12px 16px 20px;background:rgba(10,10,15,0.92);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.04);display:flex;gap:12px;align-items:center}
        .bottom-bar .info{flex:1;font-size:13px;color:rgba(255,255,255,0.3)}
        .bottom-bar .info strong{color:#fff}
        .btn-create{flex:1;padding:14px;background:linear-gradient(135deg,#3CBF8A,#2ea87a);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.3s}
        .btn-create:active{transform:scale(0.96);opacity:0.8}
        .btn-create:disabled{opacity:0.3;cursor:not-allowed;transform:none}
        .loader{text-align:center;padding:30px;color:rgba(255,255,255,0.2)}
        .loader .spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,0.05);border-top-color:#3CBF8A;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 10px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .recent-title{font-size:11px;color:rgba(255,255,255,0.15);padding:16px 4px 8px;font-weight:500;letter-spacing:0.5px}
    </style>
</head>
<body>

<div class="header">
    <span class="back material-icons-round" onclick="window.location.href='chats.html'">arrow_forward</span>
    <h1>✏️ چت جدید</h1>
    <span class="selected-count" id="selectedCount">۰ انتخاب</span>
</div>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="جستجوی نام یا شماره..." onkeyup="searchUsers()" autofocus>
</div>

<div class="contacts-list" id="contactsList">
    <div class="loader">
        <div class="spinner"></div>
        <div>در حال بارگذاری...</div>
    </div>
</div>

<div class="bottom-bar">
    <div class="info" id="bottomInfo">
        <strong id="selectedNames">هیچ‌کس</strong> انتخاب نشده
    </div>
    <button class="btn-create" id="createBtn" disabled onclick="createChat()">
        شروع گفتگو
    </button>
</div>

<script>
    const WORKER_URL = "https://appp.salhamir146.workers.dev";
    const userId = localStorage.getItem('userId');
    if (!userId) window.location.href = 'index.html';

    let selectedUsers = [];
    let allUsers = [];
    let searchTimeout = null;

    const searchInput = document.getElementById('searchInput');
    const contactsList = document.getElementById('contactsList');
    const createBtn = document.getElementById('createBtn');
    const selectedCount = document.getElementById('selectedCount');
    const selectedNames = document.getElementById('selectedNames');

    // ===== بارگذاری کاربران =====
    async function loadUsers() {
        try {
            const response = await fetch(`${WORKER_URL}/api/get-users`);
            const data = await response.json();

            if (data.success) {
                allUsers = data.users.filter(u => u.id != userId);
                renderUsers(allUsers);
            } else {
                contactsList.innerHTML = `<div class="empty-state"><span>😕</span><h3>مشکل در بارگذاری</h3></div>`;
            }
        } catch (err) {
            contactsList.innerHTML = `<div class="empty-state"><span>⚠️</span><h3>خطا در ارتباط</h3></div>`;
        }
    }

    // ===== رندر کاربران =====
    function renderUsers(users) {
        if (users.length === 0) {
            contactsList.innerHTML = `
                <div class="empty-state">
                    <span>👥</span>
                    <h3>هیچ کاربری یافت نشد</h3>
                    <p>کاربران جدید به زودی加入 می‌شوند</p>
                </div>
            `;
            return;
        }

        contactsList.innerHTML = users.map(user => {
            const isSelected = selectedUsers.some(u => u.id === user.id);
            const initial = user.name?.charAt(0) || '👤';
            return `
                <div class="contact-item ${isSelected ? 'selected' : ''}" data-id="${user.id}" onclick="toggleUser('${user.id}')">
                    <div class="contact-avatar">${initial}</div>
                    <div class="contact-info">
                        <div class="contact-name">${user.name || 'کاربر'}</div>
                        <div class="contact-phone">${user.phone || ''}</div>
                    </div>
                    <div class="contact-check"></div>
                </div>
            `;
        }).join('');
    }

    // ===== جستجو =====
    function searchUsers() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            const query = searchInput.value.trim().toLowerCase();
            if (query.length === 0) {
                renderUsers(allUsers);
                return;
            }
            const filtered = allUsers.filter(u => 
                (u.name && u.name.toLowerCase().includes(query)) ||
                (u.phone && u.phone.includes(query))
            );
            renderUsers(filtered);
        }, 300);
    }

    // ===== انتخاب کاربر =====
    function toggleUser(id) {
        const user = allUsers.find(u => u.id === id);
        if (!user) return;

        const index = selectedUsers.findIndex(u => u.id === id);
        if (index > -1) {
            selectedUsers.splice(index, 1);
        } else {
            selectedUsers.push(user);
        }

        // آپدیت UI
        document.querySelectorAll('.contact-item').forEach(el => {
            const elId = el.dataset.id;
            const isSelected = selectedUsers.some(u => u.id === elId);
            el.classList.toggle('selected', isSelected);
        });

        updateBottomBar();
    }

    // ===== آپدیت نوار پایین =====
    function updateBottomBar() {
        const count = selectedUsers.length;
        selectedCount.textContent = count === 0 ? '۰ انتخاب' : `${count} انتخاب`;

        if (count === 0) {
            selectedNames.textContent = 'هیچ‌کس';
            createBtn.disabled = true;
        } else {
            const names = selectedUsers.map(u => u.name || 'کاربر').join('، ');
            selectedNames.textContent = names;
            createBtn.disabled = false;
        }
    }

    // ===== ایجاد چت =====
    async function createChat() {
        if (selectedUsers.length === 0) {
            alert('حداقل یک کاربر را انتخاب کنید');
            return;
        }

        createBtn.disabled = true;
        createBtn.textContent = 'در حال ایجاد...';

        const chatId = 'chat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        const userIds = [userId, ...selectedUsers.map(u => u.id)];

        try {
            const response = await fetch(`${WORKER_URL}/api/create-chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chatId, userIds })
            });

            const data = await response.json();

            if (data.success) {
                // پیام خوش‌آمدگویی خودکار
                await fetch(`${WORKER_URL}/api/send-message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chatId: chatId,
                        senderId: userId,
                        text: '👋 سلام! گفتگو شروع شد.',
                        type: 'text'
                    })
                });

                window.location.href = `chat.html?chatId=${chatId}`;
            } else {
                alert('خطا در ایجاد چت: ' + (data.message || ''));
                createBtn.disabled = false;
                createBtn.textContent = 'شروع گفتگو';
            }
        } catch (err) {
            alert('خطا در ارتباط با سرور');
            createBtn.disabled = false;
            createBtn.textContent = 'شروع گفتگو';
        }
    }

    // ===== API جدید: دریافت همه کاربران =====
    // (این رو به worker.js اضافه کن)
    
    // ===== شروع =====
    loadUsers();
    updateBottomBar();

    // Enter برای جستجو
    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchUsers();
    });
</script>
</body>
</html>
