<!DOCTYPE html>
<html lang='fa' dir='rtl'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
    <title>پیام‌رسان اختصاصی - گفتگوها</title>
    <link href='https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/icon?family=Material+Icons+Round' rel='stylesheet'>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Vazirmatn;-webkit-tap-highlight-color:transparent}
        :root {
            --app-bg: #f4f6f9;
            --app-header-bg: #ffffff;
            --app-text: #222222;
            --app-subtext: #707579;
            --app-time: #999999;
            --app-hover: #f1f5f3;
            --app-border: #e4e7eb;
            --app-primary: #3CBF8A;
            --app-primary-hover: #32a875;
            --app-badge: #3CBF8A;
        }
        body { 
            background: var(--app-bg); 
            color: var(--app-text); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* هدر جدید دقیقاً مشابه تصویر */
        .app-header {
            height: 64px;
            background: var(--app-header-bg);
            display: flex;
            align-items: center;
            padding: 0 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--app-border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            gap: 12px;
        }
        .app-icon-btn { 
            width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--app-subtext); transition: all 0.2s ease; flex-shrink: 0;
        }
        .app-icon-btn:hover { background: var(--app-hover); color: var(--app-primary); }

        /* نوار جستجوی داخل هدر مشابه تصویر */
        .search-box-wrap {
            flex: 1;
            background: #f1f3f5;
            border-radius: 22px;
            height: 44px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 10px;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            border: 1px solid transparent;
        }
        .search-box-wrap:hover {
            background: #e9ecef;
        }
        .search-box-wrap .search-icon {
            color: var(--app-subtext);
            font-size: 22px;
        }
        .search-box-wrap .search-input-placeholder {
            color: var(--app-subtext);
            font-size: 14.5px;
            user-select: none;
            font-weight: 400;
        }

        .chat-list-container { 
            display: flex; 
            flex-direction: column; 
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
        }
        .chat-item {
            display: flex; align-items: center; padding: 12px 16px; cursor: pointer;
            position: relative; transition: background 0.2s ease;
            background: #ffffff;
            border-bottom: 1px solid var(--app-border);
        }
        .chat-item:hover { background: var(--app-hover); }
        .chat-item:active { transform: scale(0.99); }
        
        .avatar-wrap { position: relative; margin-left: 14px; flex-shrink: 0; }
        .chat-avatar { 
            width: 52px; height: 52px; border-radius: 50%; 
            background-size: cover; background-position: center; 
            display: flex; align-items: center; justify-content: center; 
            color: #fff; font-size: 19px; font-weight: 700;
            box-shadow: 0 3px 8px rgba(0,0,0,0.08);
        }
        
        .chat-info { flex: 1; min-width: 0; }
        .chat-row1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .chat-name { font-size: 15.5px; font-weight: 600; color: var(--app-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-time { font-size: 11.5px; color: var(--app-time); font-weight: 500; }
        
        .chat-row2 { display: flex; justify-content: space-between; align-items: center; }
        .chat-preview { font-size: 13.5px; color: var(--app-subtext); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
        
        .app-badge {
            background: var(--app-badge); color: #fff; font-size: 11px; font-weight: 600;
            padding: 2px 7px; border-radius: 12px; min-width: 22px; text-align: center;
            box-shadow: 0 2px 6px rgba(60, 191, 138, 0.3);
        }

        .app-fab {
            position: fixed; left: 24px; bottom: 24px; width: 56px; height: 56px; border-radius: 18px;
            background: var(--app-primary); color: #fff; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 20px rgba(60, 191, 138, 0.4); cursor: pointer; z-index: 90;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .app-fab:hover { transform: scale(1.08) rotate(-5deg); background: var(--app-primary-hover); }
        .app-fab:active { transform: scale(0.95); }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 200;
            align-items: flex-end;
            justify-content: center;
            animation: fadeInOverlay 0.3s ease;
        }
        .modal-overlay.active { display: flex; }
        
        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUpModal {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 28px 28px 0 0;
            padding: 20px 20px 32px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 -15px 40px rgba(0, 0, 0, 0.12);
            border-top: 1.5px solid rgba(60, 191, 138, 0.25);
            animation: slideUpModal 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            margin: 0 auto;
        }

        .modal-handle {
            width: 42px;
            height: 4px;
            background: #d0d7de;
            border-radius: 99px;
            margin: 0 auto 18px;
        }

        .modal-title {
            font-size: 16.5px;
            font-weight: 700;
            color: var(--app-text);
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .modal-title span { color: var(--app-primary); }

        .modal-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-option {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 16px;
            background: #f8fafc;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1px solid var(--app-border);
        }
        .modal-option:hover {
            background: #ffffff;
            transform: translateY(-2px);
            border-color: var(--app-primary);
            box-shadow: 0 4px 15px rgba(60, 191, 138, 0.12);
        }
        .modal-option:active { transform: scale(0.97); }

        .modal-option .icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .modal-option .icon.private { background: rgba(60, 191, 138, 0.15); color: #3CBF8A; }
        .modal-option .icon.group { background: rgba(33, 150, 243, 0.15); color: #2196F3; }
        .modal-option .icon.channel { background: rgba(255, 152, 0, 0.15); color: #FF9800; }

        .modal-option .info { flex: 1; }
        .modal-option .info .title { font-size: 14.5px; font-weight: 600; color: var(--app-text); margin-bottom: 2px; }
        .modal-option .info .desc { font-size: 12px; color: var(--app-subtext); }

        .modal-option .arrow {
            color: var(--app-subtext);
            font-size: 20px;
            transition: transform 0.2s;
        }
        .modal-option:hover .arrow { transform: translateX(-3px); color: var(--app-primary); }

        .modal-close {
            width: 100%;
            padding: 14px;
            margin-top: 14px;
            background: #f0f2f5;
            border: none;
            border-radius: 14px;
            font-size: 14.5px;
            font-weight: 600;
            color: var(--app-subtext);
            cursor: pointer;
            transition: all 0.2s;
            font-family: Vazirmatn;
        }
        .modal-close:hover { background: #e4e7eb; color: var(--app-text); }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--app-subtext);
            margin: auto;
        }
        .empty-state .icon { font-size: 56px; display: block; margin-bottom: 14px; opacity: 0.8; }
        .empty-state h3 { font-size: 17px; font-weight: 700; color: var(--app-text); margin-bottom: 6px; }
        .empty-state p { font-size: 13.5px; }

        .loader-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--app-subtext);
        }
        .loader-state .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--app-border);
            border-top-color: var(--app-primary);
            border-radius: 50%;
            animation: spinAnim 0.7s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spinAnim { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- هدر جدید مطابق عکس تلگرام: دکمه همبرگری (سه خط) در کنار نوار جستجو -->
    <div class='app-header'>
        <div class='app-icon-btn' onclick="window.location.href='profile.html'">
            <span class='material-icons-round'>menu</span>
        </div>
        <div class='search-box-wrap' onclick="searchChats()">
            <span class='material-icons-round search-icon'>search</span>
            <span class='search-input-placeholder'>جستجو</span>
        </div>
    </div>

    <div class='chat-list-container' id="chatList">
        <div class="loader-state">
            <div class="spinner"></div>
            <div>در حال بارگذاری...</div>
        </div>
    </div>

    <div class='app-fab' onclick="openModal()">
        <span class='material-icons-round' style="font-size: 26px;">edit</span>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
        <div class="modal-content">
            <div class="modal-handle"></div>
            
            <div class="modal-title">
                انتخاب نوع <span>گفتگو</span>
            </div>

            <div class="modal-options">
                <div class="modal-option" onclick="handleMenuClick('private')">
                    <div class="icon private">
                        <span class="material-icons-round">person</span>
                    </div>
                    <div class="info">
                        <div class="title">گفتگوی خصوصی</div>
                        <div class="desc">شروع چت با جستجوی شماره تلفن</div>
                    </div>
                    <span class="arrow material-icons-round">chevron_left</span>
                </div>

                <div class="modal-option" onclick="handleMenuClick('group')">
                    <div class="icon group">
                        <span class="material-icons-round">group</span>
                    </div>
                    <div class="info">
                        <div class="title">گروه جدید</div>
                        <div class="desc">ساخت گروه چندنفره</div>
                    </div>
                    <span class="arrow material-icons-round">chevron_left</span>
                </div>

                <div class="modal-option" onclick="handleMenuClick('channel')">
                    <div class="icon channel">
                        <span class="material-icons-round">campaign</span>
                    </div>
                    <div class="info">
                        <div class="title">کانال جدید</div>
                        <div class="desc">ایجاد کانال برای انتشار محتوا</div>
                    </div>
                    <span class="arrow material-icons-round">chevron_left</span>
                </div>
            </div>

            <button class="modal-close" onclick="closeModal()">انصراف</button>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://appp.salhamir146.workers.dev";
        const userId = localStorage.getItem('userId');
        
        if (!userId) {
            window.location.href = 'index.html';
        }

        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        function closeModalOutside(e) {
            if (e.target === document.getElementById('modalOverlay')) {
                closeModal();
            }
        }

        function handleMenuClick(target) {
            closeModal();
            setTimeout(() => {
                if (target === 'private') {
                    window.location.href = 'new-private.html';
                } else if (target === 'group') {
                    window.location.href = 'new-group.html';
                } else if (target === 'channel') {
                    window.location.href = 'new-channel.html';
                }
            }, 250);
        }

        function searchChats() {
            const query = prompt('جستجو در گفتگوها:');
            if (query && query.trim()) {
                const items = document.querySelectorAll('.chat-item');
                items.forEach(item => {
                    const name = item.querySelector('.chat-name')?.textContent || '';
                    item.style.display = name.includes(query.trim()) ? 'flex' : 'none';
                });
            } else {
                document.querySelectorAll('.chat-item').forEach(item => {
                    item.style.display = 'flex';
                });
            }
        }

        async function loadChats() {
            const list = document.getElementById('chatList');
            try {
                const response = await fetch(`${WORKER_URL}/api/get-chats?userId=${userId}`);
                const data = await response.json();

                if (data.success && data.chats && data.chats.length > 0) {
                    const colors = ['#3CBF8A', '#2E9AFE', '#9B59B6', '#E67E22', '#1ABC9C', '#E74C3C', '#2ECC71', '#3498DB'];
                    
                    list.innerHTML = data.chats.map((chat, index) => {
                        const name = chat.chat_name || chat.chat_id || 'گفتگو';
                        const initial = name.charAt(0).toUpperCase();
                        const colorIdx = index % colors.length;
                        const isGroup = chat.chat_type === 'group';
                        const isChannel = chat.chat_type === 'channel';
                        const icon = isGroup ? 'گ' : isChannel ? 'ک' : '';
                        
                        return `
                            <div class='chat-item' onclick="window.location.href='chat.html?chatId=${chat.chat_id}'">
                                <div class='avatar-wrap'>
                                    <div class='chat-avatar' style="background-color: ${colors[colorIdx]};">${icon || initial}</div>
                                </div>
                                <div class='chat-info'>
                                    <div class='chat-row1'>
                                        <div class='chat-name'>${name}</div>
                                        <div class='chat-time'>${chat.message_count || 'جدید'}</div>
                                    </div>
                                    <div class='chat-row2'>
                                        <div class='chat-preview'>${chat.last_message || 'شروع گفتگو...'}</div>
                                        ${chat.unread_count ? `<div class='app-badge'>${chat.unread_count}</div>` : ''}
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    list.innerHTML = `
                        <div class="empty-state">
                            <span class="icon">💬</span>
                            <h3>هنوز گفتگویی ندارید</h3>
                            <p>روی دکمه ✏️ پایین صفحه کلیک کنید</p>
                        </div>
                    `;
                }
            } catch (err) {
                list.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">⚠️</span>
                        <h3>خطا در بارگذاری</h3>
                        <p>لطفاً دوباره تلاش کنید</p>
                    </div>
                `;
            }
        }

        loadChats();
        setInterval(loadChats, 10000);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
