<!DOCTYPE html>
<html lang='fa' dir='rtl'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1'>
    <link href='https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/icon?family=Material+Icons+Round' rel='stylesheet'>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Vazirmatn}
        :root {
            --tg-bg: #ffffff;
            --tg-header-bg: #ffffff;
            --tg-text: #222222;
            --tg-subtext: #707579;
            --tg-time: #999999;
            --tg-hover: #f1f2f6;
            --tg-border: #f0f0f0;
            --tg-primary: #3CBF8A;
            --tg-badge: #3CBF8A;
        }
        body { background: var(--tg-bg); color: var(--tg-text); }

        /* هدر دقیق تلگرام */
        .tg-header {
            height: 56px; background: var(--tg-header-bg); display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--tg-border);
        }
        .tg-header-right { display: flex; align-items: center; gap: 16px; }
        .tg-icon-btn { 
            width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--tg-subtext); transition: background 0.2s;
        }
        .tg-icon-btn:hover { background: var(--tg-hover); }
        .tg-app-title { font-size: 20px; font-weight: 600; color: var(--tg-text); }

        /* لیست چت‌ها */
        .tg-chat-list { display: flex; flex-direction: column; }
        .tg-chat-item {
            display: flex; align-items: center; padding: 9px 12px; cursor: pointer;
            position: relative; transition: background 0.2s;
        }
        .tg-chat-item:hover { background: var(--tg-hover); }
        
        /* آواتار تلگرامی با استیکر آنلاین */
        .tg-avatar-wrap { position: relative; margin-left: 14px; flex-shrink: 0; }
        .tg-avatar { width: 54px; height: 54px; border-radius: 50%; background: #e0e0e0; background-size: cover; background-position: center; }
        
        .tg-chat-info { flex: 1; min-width: 0; border-bottom: 1px solid var(--tg-border); padding-bottom: 10px; }
        .tg-chat-item:last-child .tg-chat-info { border-bottom: none; }
        
        .tg-chat-row1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
        .tg-chat-name { font-size: 15px; font-weight: 600; color: var(--tg-text); }
        .tg-chat-time { font-size: 12px; color: var(--tg-time); font-weight: 400; }
        
        .tg-chat-row2 { display: flex; justify-content: space-between; align-items: center; }
        .tg-chat-preview { font-size: 13.5px; color: var(--tg-subtext); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; }
        
        .tg-badge {
            background: var(--tg-badge); color: #fff; font-size: 11px; font-weight: 600;
            padding: 1px 6px; border-radius: 10px; min-width: 20px; text-align: center;
        }

        /* دکمه مداد شناور تلگرام (FAB) */
        .tg-fab {
            position: fixed; left: 20px; bottom: 20px; width: 52px; height: 52px; border-radius: 16px;
            background: var(--tg-primary); color: #fff; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(60, 191, 138, 0.35); cursor: pointer; z-index: 90;
            transition: transform 0.2s;
        }
        .tg-fab:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div class='tg-header'>
        <div class='tg-header-right'>
            <div class='tg-icon-btn' onclick="window.location.href='profile.html'">
                <span class='material-icons-round'>menu</span>
            </div>
            <div class='tg-app-title'>تلگرام</div>
        </div>
        <div class='tg-icon-btn' onclick="alert('🔍 جستجوی چت‌ها')">
            <span class='material-icons-round'>search</span>
        </div>
    </div>

    <div class='tg-chat-list' id="chatList">
        <!-- چت‌ها از دیتابیس بارگذاری میشن -->
        <div style="text-align:center;padding:40px;color:var(--tg-subtext);">⏳ در حال بارگذاری...</div>
    </div>

    <div class='tg-fab' onclick="window.location.href='new-chat.html'">
        <span class='material-icons-round'>edit</span>
    </div>

    <script>
        const WORKER_URL = "https://appp.salhamir146.workers.dev";
        const userId = localStorage.getItem('userId');
        if (!userId) window.location.href = 'index.html';

        // ===== بارگذاری چت‌ها از دیتابیس =====
        async function loadChats() {
            const list = document.getElementById('chatList');
            try {
                const response = await fetch(`${WORKER_URL}/api/get-chats?userId=${userId}`);
                const data = await response.json();

                if (data.success && data.chats.length > 0) {
                    list.innerHTML = data.chats.map(chat => {
                        const name = chat.chat_name || chat.chat_id || 'گفتگو';
                        const initial = name.charAt(0).toUpperCase();
                        const colors = ['#3CBF8A', '#52D39A', '#2CBF71', '#4CAF50', '#8BC34A'];
                        const colorIndex = chat.chat_id.length % colors.length;
                        return `
                            <div class='tg-chat-item' onclick="window.location.href='chat.html?chatId=${chat.chat_id}'">
                                <div class='tg-avatar-wrap'>
                                    <div class='tg-avatar' style="background-color: ${colors[colorIndex]}; display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; font-weight:700;">${initial}</div>
                                </div>
                                <div class='tg-chat-info'>
                                    <div class='tg-chat-row1'>
                                        <div class='tg-chat-name'>${name}</div>
                                        <div class='tg-chat-time'>${chat.message_count || 0} پیام</div>
                                    </div>
                                    <div class='tg-chat-row2'>
                                        <div class='tg-chat-preview'>${chat.last_message || 'شروع گفتگو...'}</div>
                                        ${chat.unread_count ? `<div class='tg-badge'>${chat.unread_count}</div>` : ''}
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    list.innerHTML = `
                        <div style="text-align:center;padding:60px 20px;color:var(--tg-subtext);">
                            <div style="font-size:48px;margin-bottom:12px;">💬</div>
                            <div style="font-size:16px;font-weight:600;color:var(--tg-text);">هنوز چتی ندارید</div>
                            <div style="font-size:13px;margin-top:4px;">با کلیک روی دکمه ✏️ پایین صفحه شروع کنید</div>
                        </div>
                    `;
                }
            } catch (err) {
                list.innerHTML = `
                    <div style="text-align:center;padding:60px 20px;color:var(--tg-subtext);">
                        <div style="font-size:48px;margin-bottom:12px;">⚠️</div>
                        <div style="font-size:16px;font-weight:600;color:var(--tg-text);">خطا در بارگذاری</div>
                        <div style="font-size:13px;margin-top:4px;">لطفاً دوباره تلاش کنید</div>
                    </div>
                `;
                console.error('Error loading chats:', err);
            }
        }

        // ===== بارگذاری خودکار =====
        loadChats();

        // بارگذاری مجدد هر ۱۰ ثانیه
        setInterval(loadChats, 10000);
    </script>
</body>
</html>
