<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ساخت کانال جدید</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Vazirmatn;-webkit-tap-highlight-color:transparent}
        body{background:#f4f6f9;min-height:100vh;display:flex;flex-direction:column}
        
        .app-header{background:#ffffff;padding:14px 18px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #e4e7eb;position:sticky;top:0;z-index:100}
        .app-header .back-btn{font-size:24px;cursor:pointer;color:#707579;transition:color 0.2s}
        .app-header .back-btn:hover{color:#3CBF8A}
        .app-header h1{font-size:17px;font-weight:600;color:#222;flex:1}
        
        .main-container{padding:24px 16px;max-width:520px;margin:0 auto;width:100%;flex:1}
        .section-title{font-size:13px;color:#3CBF8A;font-weight:600;margin-bottom:12px}
        
        .input-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
        .input-group label{font-size:13px;color:#707579;font-weight:500}
        .app-input{width:100%;padding:14px 16px;background:#ffffff;border:1.5px solid #e4e7eb;border-radius:12px;font-size:15px;outline:none;transition:border-color 0.3s;color:#222}
        .app-input:focus{border-color:#3CBF8A;box-shadow:0 0 0 3px rgba(60,191,138,0.1)}
        .app-input::placeholder{color:#b0b8c1}
        
        .app-submit-btn{width:100%;padding:15px;background:#3CBF8A;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:background 0.2s;margin-top:8px}
        .app-submit-btn:hover{background:#32a875}
        .app-submit-btn:active{transform:scale(0.97)}
        .app-submit-btn:disabled{opacity:0.5;cursor:not-allowed}
        
        .result-box{padding:16px;border-radius:12px;margin-top:16px;display:none;font-size:14px}
        .result-box.success{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7;display:block}
        .result-box.error{background:#fce4ec;color:#c62828;border:1px solid #ef9a9a;display:block}
        .result-box.info{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block}
        
        .loader-box{text-align:center;padding:30px;display:none}
        .loader-box .spinner{width:28px;height:28px;border:3px solid #e4e7eb;border-top-color:#3CBF8A;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 10px}
        @keyframes spin{to{transform:rotate(360deg)}}

        .info-note{background:#e3f2fd;padding:12px 16px;border-radius:10px;font-size:13px;color:#0d47a1;margin-bottom:16px;border-right:3px solid #2196F3}
        .info-note .title{font-weight:600;display:block;margin-bottom:4px}
    </style>
</head>
<body>

    <div class="app-header">
        <span class="back-btn material-icons-round" onclick="window.location.href='chats.html'">arrow_forward</span>
        <h1>ساخت کانال جدید</h1>
    </div>

    <div class="main-container">
        <div class="info-note">
            <span class="title">کانال چیست؟</span>
            کانال محلی برای انتشار مطالب عمومی است. فقط مدیر کانال می‌تواند پیام ارسال کند و کاربران فقط می‌توانند مطالب را مشاهده کنند.
        </div>

        <div class="section-title">اطلاعات کانال</div>
        
        <div class="input-group">
            <label>نام کانال</label>
            <input type="text" id="channelName" class="app-input" placeholder="نام کانال را وارد کنید">
        </div>
        
        <div class="input-group">
            <label>توضیحات کانال</label>
            <input type="text" id="channelDesc" class="app-input" placeholder="توضیحات کانال (اختیاری)">
        </div>
        
        <div class="input-group">
            <label>نام کاربری کانال (آیدی)</label>
            <input type="text" id="channelUsername" class="app-input" placeholder="@channel_name" dir="ltr">
        </div>

        <button class="app-submit-btn" id="createBtn" onclick="createChannel()">ایجاد کانال</button>
        
        <div id="loader" class="loader-box"><div class="spinner"></div><div>در حال ایجاد کانال...</div></div>
        <div id="resultBox" class="result-box"></div>
    </div>

    <script>
        const WORKER_URL = "https://appp.salhamir146.workers.dev";
        const userId = localStorage.getItem('userId');
        if (!userId) window.location.href = 'index.html';

        async function createChannel() {
            const name = document.getElementById('channelName').value.trim();
            const desc = document.getElementById('channelDesc').value.trim();
            const username = document.getElementById('channelUsername').value.trim();
            const resultBox = document.getElementById('resultBox');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('createBtn');

            if (!name) {
                resultBox.className = 'result-box error';
                resultBox.textContent = 'لطفاً نام کانال را وارد کنید.';
                resultBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            loader.style.display = 'block';
            resultBox.style.display = 'none';

            try {
                const chatId = 'channel_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);
                
                const response = await fetch(`${WORKER_URL}/api/create-chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        chatId, 
                        userIds: [userId],
                        chatName: name,
                        chatType: 'channel',
                        chatDesc: desc,
                        chatUsername: username || '@' + name.replace(/\s/g, '_').toLowerCase()
                    })
                });
                const data = await response.json();

                if (data.success) {
                    await fetch(`${WORKER_URL}/api/send-message`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chatId, senderId: userId, text: 'کانال ' + name + ' ایجاد شد. اولین پیام.' })
                    });

                    resultBox.className = 'result-box success';
                    resultBox.textContent = 'کانال "' + name + '" با موفقیت ایجاد شد.';
                    resultBox.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = `chat.html?chatId=${chatId}`;
                    }, 1500);
                } else {
                    resultBox.className = 'result-box error';
                    resultBox.textContent = 'خطا در ایجاد کانال.';
                    resultBox.style.display = 'block';
                }
            } catch (err) {
                resultBox.className = 'result-box error';
                resultBox.textContent = 'خطا در ارتباط با سرور.';
                resultBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }

        document.getElementById('channelName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') createChannel();
        });
    </script>
</body>
</html>
